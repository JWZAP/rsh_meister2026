<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk Großbild-Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            padding: 3vh 3vw;
            display: flex;
            flex-direction: column;
        }
        
        /* OBERE ZEITEILE (Immer sichtbar) */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #00d2ff;
            padding-bottom: 1.5vh;
            margin-bottom: 3vh;
        }
        .header h1 { font-size: 4.5vh; text-transform: uppercase; color: #ffffff; letter-spacing: 2px; }
        .slide-title { font-size: 3.5vh; color: #00d2ff; font-weight: bold; text-transform: uppercase; }

        /* SLIDE CONTAINER STEUERUNG */
        .slide { display: none; flex: 1; flex-direction: column; justify-content: center; }
        .slide.active { display: flex; }

        /* RIESEN-TABELLE (Seite 1) */
        .big-table { width: 100%; border-collapse: collapse; font-size: 3.8vh; }
        .big-table th { font-size: 2.8vh; color: #aaaaaa; text-transform: uppercase; padding: 1.5vh 1vw; border-bottom: 4px solid #333; }
        .big-table td { padding: 2vh 1vw; border-bottom: 2px solid #222; }
        .big-table tr:nth-child(1) td { color: #ffd700; font-weight: bold; } /* Platz 1 Gold */
        .big-table tr:nth-child(2) td { color: #c0c0c0; font-weight: bold; } /* Platz 2 Silber */
        .centered { text-align: center; }

        /* HIGHLIGHT SPIELPLAN (Seite 2) */
        .spiel-row { background: #111; margin-bottom: 2vh; padding: 2.5vh; border-radius: 12px; border-left: 10px solid #555; display: flex; align-items: center; font-size: 3.5vh; }
        .spiel-row.heute { border-left-color: #00d2ff; background: #00152b; }
        .spiel-row.live { border-left-color: #ff3333; background: #2b0000; animation: pulsieren 1.5s infinite ease-in-out; }
        .spiel-zeit { width: 25%; font-size: 2.5vh; color: #888; }
        .spiel-heute .spiel-zeit { color: #00d2ff; font-weight: bold; }
        .spiel-paarung { width: 45%; font-weight: bold; }
        .spiel-erg { width: 10%; text-align: center; font-weight: bold; color: #ffb703; font-size: 4.5vh; }
        .spiel-ort { width: 20%; font-size: 2.3vh; color: #aaa; text-align: right; font-style: italic; }

        /* FINALE / LIVE FOCUS (Seite 3) */
        .focus-box { background: #160707; border: 4px solid #ff4d4d; border-radius: 20px; padding: 5vh; text-align: center; }
        .focus-title { font-size: 4vh; color: #ff4d4d; text-transform: uppercase; margin-bottom: 2vh; letter-spacing: 3px; }
        .focus-teams { font-size: 6.5vh; font-weight: bold; margin: 3vh 0; letter-spacing: 1px; color: #ffffff; }
        .focus-score { font-size: 12vh; font-weight: bold; color: #ffb703; font-family: monospace; background: #000; display: inline-block; padding: 1vh 5vw; border-radius: 15px; border: 2px solid #333; }
        .focus-info { font-size: 3vh; color: #888; margin-top: 3vh; }

        /* Animationen */
        @keyframes pulsieren { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }
    </style>
</head>
<body>

    <div class="header">
        <h1>Rheinstettener Meisterschaften</h1>
        <div class="slide-title" id="slide-name">Tabelle</div>
    </div>

    <!-- SEITE 1: DIE AKTUELLE BLITZTABELLE -->
    <div class="slide active" id="slide-tabelle">
        <table class="big-table">
            <thead>
                <tr>
                    <th class="centered">Pl.</th>
                    <th>Mannschaft</th>
                    <th class="centered">Sp.</th>
                    <th class="centered">Tore</th>
                    <th class="centered">Diff.</th>
                    <th class="centered">Punkte</th>
                </tr>
            </thead>
            <tbody id="tabelle-body"></tbody>
        </table>
    </div>

    <!-- SEITE 2: SPIELPLAN MIT HIGHLIGHTS -->
    <div class="slide" id="slide-spielplan">
        <div id="spiele-body"></div>
    </div>

    <!-- SEITE 3: GROSSES FINALE / LIVE FOCUS -->
    <div class="slide" id="slide-finale">
        <div class="focus-box">
            <div class="focus-title" id="focus-header">Großes Finale</div>
            <div class="focus-teams"><span id="f-team1">Heim</span> vs. <span id="f-team2">Gast</span></div>
            <div><span class="focus-score" id="f-ergebnis">-:-</span></div>
            <div class="focus-info" id="focus-ort">Spielort wird geladen...</div>
        </div>
    </div>

    <script>
        // Verhindert Cache-Probleme beim Laden des Skripts
        const script = document.createElement('script');
        script.src = 'skript.js?v=' + new Date().getTime();
        document.head.appendChild(script);

        // ZYKLISCHER SEITENWECHSEL (Alle 12 Sekunden)
        let aktuelleSeite = 0;
        const slides = ["slide-tabelle", "slide-spielplan", "slide-finale"];
        const titel = ["Aktuelle Blitztabelle", "Spielplan & Highlights", "Match Fokus"];

        function wechsleSeite() {
            document.getElementById(slides[aktuelleSeite]).classList.remove("active");
            aktuelleSeite = (aktuelleSeite + 1) % slides.length;
            document.getElementById(slides[aktuelleSeite]).classList.add("active");
            document.getElementById("slide-name").innerText = titel[aktuelleSeite];
        }
        setInterval(wechsleSeite, 12000); // 12000 Millisekunden = 12 Sekunden
    </script>
</body>
</html>
