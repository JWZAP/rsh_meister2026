<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk Großbild-Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            overflow: hidden; /* Verhindert Scrollen */
            padding: 3vh 3vw;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #00d2ff;
            padding-bottom: 1.5vh;
            margin-bottom: 3vh;
        }
        .header h1 { font-size: 4.5vh; text-transform: uppercase; color: #ffffff; letter-spacing: 2px; }
        .slide-title { font-size: 3.5vh; color: #00d2ff; font-weight: bold; text-transform: uppercase; }

        .slide { display: none; flex: 1; flex-direction: column; justify-content: flex-start; }
        .slide.active { display: flex; }

        /* TABELLE */
        .big-table { width: 100%; border-collapse: collapse; font-size: 3.6vh; }
        .big-table th { font-size: 2.6vh; color: #aaaaaa; text-transform: uppercase; padding: 1.5vh 1vw; border-bottom: 4px solid #333; text-align: left; }
        .big-table td { padding: 1.8vh 1vw; border-bottom: 2px solid #222; }
        .big-table tr:nth-child(1) td { color: #ffd700; font-weight: bold; }
        .big-table tr:nth-child(2) td { color: #c0c0c0; font-weight: bold; }
        .centered { text-align: center !important; }

        /* SPIELPLAN ROW */
        .spiel-row { background: #111; margin-bottom: 1.8vh; padding: 2vh 2.5vh; border-radius: 12px; border-left: 10px solid #555; display: flex; align-items: center; font-size: 3.3vh; }
        .spiel-row.heute { border-left-color: #00d2ff; background: #00152b; }
        .spiel-row.live { border-left-color: #ff3333; background: #2b0000; animation: pulsieren 1.5s infinite ease-in-out; }
        .spiel-zeit { width: 25%; font-size: 2.5vh; color: #aaa; }
        .heute .spiel-zeit { color: #00d2ff; font-weight: bold; }
        .spiel-paarung { width: 45%; font-weight: bold; }
        .spiel-erg { width: 10%; text-align: center; font-weight: bold; color: #ffb703; font-size: 4vh; }
        .spiel-ort { width: 20%; font-size: 2.2vh; color: #aaa; text-align: right; font-style: italic; }

        /* FINALE SEGMENT */
        .focus-box { background: #160707; border: 4px solid #ff4d4d; border-radius: 20px; padding: 5vh; text-align: center; height: 100%; display: flex; flex-direction: column; justify-content: center; }
        .focus-title { font-size: 4.5vh; color: #ff4d4d; text-transform: uppercase; margin-bottom: 2vh; letter-spacing: 3px; font-weight: bold; }
        .focus-teams { font-size: 6.5vh; font-weight: bold; margin: 3vh 0; letter-spacing: 1px; }
        .focus-score { font-size: 11vh; font-weight: bold; color: #ffb703; font-family: monospace; background: #000; display: inline-block; padding: 1vh 5vw; border-radius: 15px; border: 2px solid #333; }
        .focus-info { font-size: 3.5vh; color: #ccc; margin-top: 3vh; font-style: italic; }

        @keyframes pulsieren { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }
    </style>
</head>
<body>

    <div class="header">
        <h1>Rheinstettener Meisterschaften</h1>
        <div class="slide-title" id="slide-name">Turnierdaten werden geladen...</div>
    </div>

    <!-- Dynamischer Bereich, der per JS befüllt wird -->
    <div id="slides-container"></div>

    <script>
        // Verhindert Cache-Probleme beim Laden des Skripts
        const script = document.createElement('script');
        script.src = 'skript.js?v=' + new Date().getTime();
        document.head.appendChild(script);

        let aktuelleSeite = 0;
        let slideIds = [];
        let slideTitel = [];

        function initialisiereWechsel(ids, titel) {
            slideIds = ids;
            slideTitel = titel;
            if(slideIds.length > 0) {
                document.getElementById(slideIds[0]).classList.add("active");
                document.getElementById("slide-name").innerText = slideTitel[0];
                setInterval(wechsleSeite, 12000); // Alle 12 Sekunden umblättern
            }
        }

        function wechsleSeite() {
            if (slideIds.length === 0) return;
            document.getElementById(slideIds[aktuelleSeite]).classList.remove("active");
            aktuelleSeite = (aktuelleSeite + 1) % slideIds.length;
            document.getElementById(slideIds[aktuelleSeite]).classList.add("active");
            document.getElementById("slide-name").innerText = slideTitel[aktuelleSeite];
        }
    </script>
</body>
</html>
